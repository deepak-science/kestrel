# Example: scheduled drift detection for kestci, GitHub-hosted runners.
#
# Runs `kestci plan` on a schedule and fails (alerting) when a root has drifted
# from its committed config. Same public-stacks-only scoping as
# github-plan-apply.yml.
#
# `-- -detailed-exitcode` is forwarded to plan: exit 0 is in sync, 2 is drift, anything else is a failure.
name: terraform-drift
on:
  schedule:
    # Weekly, Monday 13:17 UTC.
    - cron: "17 13 * * 1"
  workflow_dispatch: {}
permissions:
  id-token: write
  contents: read
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
jobs:
  drift:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [cloudflare, ses-smtp]
    container:
      image: ghcr.io/deepak-science/kestrel:latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: us-east-2
      - name: Plan and flag drift
        run: |
          kestci init "${{ matrix.root }}"
          echo "::group::tofu plan (${{ matrix.root }})"
          status=0
          kestci plan "${{ matrix.root }}" -- -detailed-exitcode || status=$?
          echo "::endgroup::"
          case "$status" in
            0) echo "::notice::${{ matrix.root }} is in sync" ;;
            2) echo "::error::${{ matrix.root }} has drifted from committed config"; exit 1 ;;
            *) echo "::error::${{ matrix.root }}: plan failed"; exit "$status" ;;
          esac
